name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend (PHP 8.4 + Laravel 13)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: online_shop_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, fileinfo, curl
          coverage: none

      - name: Copy .env
        run: cp backend/.env.example backend/.env

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --working-dir=backend

      - name: Generate key
        run: php backend/artisan key:generate

      - name: Run Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: online_shop_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php backend/artisan migrate --force

      - name: Execute Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php backend/artisan test

  flutter-apps:
    name: Flutter Apps (Customer & Courier)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Customer App Analysis & Tests
        run: |
          cd apps/customer_flutter
          flutter pub get
          flutter analyze
          flutter test

      - name: Courier App Analysis & Tests
        run: |
          cd apps/courier_flutter
          flutter pub get
          flutter analyze
          flutter test
