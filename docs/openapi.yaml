openapi: 3.1.0
info:
  title: Marketplace Multi-Vendor API
  version: 1.0.0
  description: Chakana va ulgurji savdoli ko'p sotuvchili marketplace platformasi uchun API spetsifikatsiyasi.
servers:
  - url: http://localhost:8000/api/v1
    description: Mahalliy rivojlantirish serveri

paths:
  /health:
    get:
      summary: Tizim salomatligi va xizmatlar holati
      description: Backend, PHP versiyasi, MySQL bazasi va muhit holatini tekshiradi.
      responses:
        '200':
          description: Tizim to'liq ishchi holatda
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unikal so'rov identifikatori
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Tizimda yoki ma'lumotlar bazasida nosozlik mavjud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      summary: Yangi foydalanuvchini ro'yxatdan o'tkazish
      description: Xaridor, ulgurji xaridor yoki do'kon egasi sifatida ro'yxatdan o'tish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
                - account_type
              properties:
                name:
                  type: string
                  example: Alisher Navoiy
                email:
                  type: string
                  format: email
                  example: alisher@example.uz
                phone:
                  type: string
                  example: "+998901234567"
                password:
                  type: string
                  format: password
                  example: secret12345
                account_type:
                  type: string
                  enum: [customer, wholesale_customer, seller]
                  example: customer
                store_name:
                  type: string
                  description: account_type=seller bo'lsa majburiy
                  example: "Oltin Voha Savdo"
      responses:
        '201':
          description: Foydalanuvchi muvaffaqiyatli ro'yxatdan o'tdi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '422':
          description: Validatsiya xatosi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Tizimga kirish
      description: Email/telefon va parol orqali tizimga kirish va Sanctum token olish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  example: alisher@example.uz
                password:
                  type: string
                  example: secret12345
      responses:
        '200':
          description: Kirish muvaffaqiyatli
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '403':
          description: Hisob faolsizlantirilgan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Noto'g'ri login yoki parol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/otp/send:
    post:
      summary: Telefon orqali tasdiqlash kodini (OTP) yuborish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "+998901234567"
                type:
                  type: string
                  enum: [login, register, password_reset]
                  default: login
      responses:
        '200':
          description: Kod yuborildi

  /auth/otp/verify:
    post:
      summary: Tasdiqlash kodini tekshirish va kirish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  example: "+998901234567"
                code:
                  type: string
                  example: "123456"
                type:
                  type: string
                  default: login
      responses:
        '200':
          description: Telefon tasdiqlandi va token berildi
        '422':
          description: Kod noto'g'ri yoki muddati o'tgan

  /auth/me:
    get:
      summary: Joriy foydalanuvchi profili, rollari va do'koni
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil ma'lumotlari
        '401':
          description: Autentifikatsiyadan o'tilmagan

  /auth/logout:
    post:
      summary: Tizimdan chiqish (joriy tokenni bekor qilish)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Muvaffaqiyatli chiqildi

  /addresses:
    get:
      summary: Foydalanuvchining saqlangan manzillari ro'yxati
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Manzillar ro'yxati
    post:
      summary: Yangi yetkazib berish manzilini qo'shish
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - recipient_name
                - phone
                - full_address
              properties:
                title:
                  type: string
                  example: "Uy"
                recipient_name:
                  type: string
                  example: "Farhod"
                phone:
                  type: string
                  example: "+998901234567"
                full_address:
                  type: string
                  example: "Toshkent sh., Chilonzor 9, 12-uy"
                is_default:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Manzil yaratildi

  /seller/profile:
    get:
      summary: O'z do'koni ma'lumotlarini ko'rish (Multi-tenant)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Do'kon profili
        '403':
          description: Ruxsat yo'q yoki do'kon boshqaga tegishli
    put:
      summary: Do'kon ma'lumotlarini yangilash
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Do'kon yangilandi
        '403':
          description: Boshqa sotuvchining do'konini o'zgartirish taqiqlangan

  /admin/sellers:
    get:
      summary: Barcha sotuvchilar ro'yxati (Faqat Administrator/Moderator)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sotuvchilar ro'yxati
        '403':
          description: Ruxsat berilmagan (Oddiy xaridor yoki sotuvchi kirishi taqiqlangan)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - success
        - message
        - data
        - request_id
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Tizim barqaror ishlamoqda
        data:
          type: object
        request_id:
          type: string
          example: 9d1b09b0-4f51-419b-a0ef-192a2a013e8b

    AuthSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
        - request_id
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Tizimga muvaffaqiyatli kirildi
        data:
          type: object
          properties:
            token:
              type: string
              example: "1|abcdef123456..."
            token_type:
              type: string
              example: Bearer
            user:
              type: object
        request_id:
          type: string
          example: 9d1b09b0-4f51-419b-a0ef-192a2a013e8b

    ErrorResponse:
      type: object
      required:
        - success
        - error
        - request_id
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: "Ushbu amalni bajarish uchun sizda yetarli ruxsat yo'q"
            details:
              type: object
              nullable: true
        request_id:
          type: string
          example: 9d1b09b0-4f51-419b-a0ef-192a2a013e8b
