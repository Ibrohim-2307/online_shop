services:
  - type: web
    name: online-shop
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    disk:
      name: marketplace-data
      mountPath: /var/www/html/storage/data
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: MARKET
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/data/database.sqlite
      - key: PAYMENT_ALLOW_DEMO
        value: false
